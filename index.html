<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="naver-site-verification" content="1abef9148b9243d7dfede54b26c4fa5bfef1f7c6" />
    <meta name="robots" content="noindex, nofollow">
    <title>소마 (SoMa AI)</title>
    <meta name="description" content="웹사이트 리뉴얼 중입니다. 다시 좋은 모습으로 찾아뵐게요.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="소마 (SoMa AI)">
    <meta property="og:description" content="웹사이트 리뉴얼 중입니다. 다시 좋은 모습으로 찾아뵐게요.">
    <meta property="og:image" content="https://soma.ai.kr/og_image.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --navy-deep: #071428;
            --navy: #0c1f3d;
            --blue: #2E8CD5;
            --cyan: #5FCDF9;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            color: var(--white);
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(46, 140, 213, 0.22), transparent 55%),
                radial-gradient(ellipse 70% 50% at 80% 100%, rgba(95, 205, 249, 0.12), transparent 50%),
                linear-gradient(165deg, var(--navy-deep) 0%, var(--navy) 55%, #0a1830 100%);
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            text-align: center;
            max-width: 420px;
            animation: rise 0.9s cubic-bezier(.22, .61, .36, 1) both;
        }

        .logo {
            width: 120px;
            height: auto;
            margin: 0 auto 36px;
            display: block;
            opacity: 0.95;
        }

        h1 {
            font-size: clamp(1.35rem, 3.5vw, 1.65rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.45;
            margin-bottom: 14px;
        }

        p {
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.72);
        }

        .accent {
            display: block;
            width: 36px;
            height: 2px;
            margin: 28px auto 0;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            border-radius: 1px;
            opacity: 0.85;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .wrap {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <img class="logo" src="logo.png" alt="SoMa">
        <h1>웹사이트 리뉴얼 중입니다.</h1>
        <p>다시 좋은 모습으로 찾아뵐게요.</p>
        <span class="accent" aria-hidden="true"></span>
    </main>
</body>
</html>
