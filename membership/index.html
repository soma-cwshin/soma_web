<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>SoMa 멤버십 맵 — 충전·차감형 타겟 업장</title>
  <meta name="description" content="서울·경기·인천 금액권 멤버십 타겟 업장 지도 (비공개)">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
  <style>
    :root {
      --bg: #071428;
      --panel: rgba(12, 31, 61, 0.94);
      --panel-2: #122847;
      --line: rgba(255, 255, 255, 0.1);
      --ink: #fff;
      --ink-2: rgba(255, 255, 255, 0.72);
      --ink-3: rgba(255, 255, 255, 0.48);
      --blue: #2E8CD5;
      --cyan: #5FCDF9;
      --yellow: #FFE100;
      --customer: #22c55e;
      --high: #5FCDF9;
      --medium: #94a3b8;
      --sidebar-w: 400px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(95, 205, 249, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(46, 140, 213, 0.22), transparent 45%),
        var(--bg);
      color: var(--ink);
      overflow: hidden;
    }
    .hidden { display: none !important; }
    .login-screen {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(46,140,213,.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(95,205,249,.1), transparent 40%), var(--bg);
      padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 360px; background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .login-card h2 { font-size: 20px; margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; line-height: 1.5; word-break: keep-all; }
    .login-card input[type="password"] {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: rgba(0,0,0,.25); color: var(--ink); font-size: 15px; outline: none; margin-bottom: 12px;
    }
    .login-card input[type="password"]:focus { border-color: var(--blue); }
    .login-error { color: #f87171; font-size: 12px; min-height: 18px; margin-bottom: 8px; }
    .btn.primary {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 600; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #2E8CD5, #5FCDF9); color: #071428; cursor: pointer;
    }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 20px; border-bottom: 1px solid var(--line);
      background: rgba(7,20,40,.85); backdrop-filter: blur(14px); z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand a.logo { color: var(--cyan); font-weight: 800; font-size: 18px; text-decoration: none; }
    .brand-copy h1 { font-size: 15px; font-weight: 700; }
    .brand-copy p { font-size: 12px; color: var(--ink-3); margin-top: 2px; word-break: keep-all; }
    .header-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .chip {
      font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(18,40,71,.8); white-space: nowrap;
    }
    .chip strong { color: var(--cyan); }
    .main { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 0; }
    .sidebar {
      display: flex; flex-direction: column; min-height: 0;
      background: var(--panel); border-right: 1px solid var(--line);
    }
    .intro { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
    .intro .label {
      font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--cyan); margin-bottom: 8px;
    }
    .intro h2 { font-size: 17px; font-weight: 750; line-height: 1.35; word-break: keep-all; margin-bottom: 6px; }
    .intro p { font-size: 12px; color: var(--ink-2); line-height: 1.5; word-break: keep-all; }
    .controls { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
    .controls input, .controls select {
      width: 100%; border: 1px solid var(--line); background: rgba(7,20,40,.6); color: var(--ink);
      border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 13px; outline: none;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filters button {
      appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
      font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    }
    .filters button.active {
      background: rgba(46,140,213,.25); border-color: rgba(95,205,249,.55); color: var(--cyan);
    }
    .list { flex: 1; overflow: auto; padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 8px; }
    .card {
      text-align: left; width: 100%; border: 1px solid var(--line); background: rgba(18,40,71,.55);
      border-radius: 14px; padding: 12px 13px; color: inherit; cursor: pointer; font: inherit;
    }
    .card:hover { border-color: rgba(95,205,249,.35); }
    .card.active { border-color: rgba(95,205,249,.7); background: rgba(46,140,213,.18); }
    .card-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .card h3 { font-size: 14px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
    .badge { flex-shrink: 0; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px; }
    .badge.customer { background: rgba(34,197,94,.2); color: #86efac; }
    .badge.high { background: rgba(95,205,249,.18); color: var(--cyan); }
    .badge.medium { background: rgba(148,163,184,.2); color: #cbd5e1; }
    .meta { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.06); color: var(--ink-2); }
    .traits { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .traits li {
      font-size: 12px; color: var(--ink-2); line-height: 1.45; padding-left: 12px; position: relative; word-break: keep-all;
    }
    .traits li::before {
      content: ''; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%;
      background: var(--cyan); opacity: .7;
    }
    .fit { margin-top: 8px; font-size: 12px; color: var(--yellow); font-weight: 600; word-break: keep-all; }
    .map-wrap { position: relative; min-height: 0; }
    #map { width: 100%; height: 100%; background: #0a1628; }
    .map-legend {
      position: absolute; left: 14px; bottom: 18px; z-index: 500; display: flex; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 12px; background: rgba(7,20,40,.9); border: 1px solid var(--line);
      font-size: 11px; color: var(--ink-2);
    }
    .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.customer { background: var(--customer); }
    .dot.high { background: var(--high); }
    .dot.medium { background: var(--medium); }
    .marker-pin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .leaflet-popup-content-wrapper { background: #122847; color: #fff; border-radius: 12px; }
    .leaflet-popup-tip { background: #122847; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.45; }
    .leaflet-popup-content strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .leaflet-popup-content .popup-fit { color: #FFE100; font-size: 12px; margin-top: 6px; }
    .leaflet-popup-content a { color: #5FCDF9; }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background: rgba(46,140,213,.35) !important;
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background: #2E8CD5 !important; color: #fff !important; font-weight: 700;
    }
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
      .sidebar { border-right: none; border-top: 1px solid var(--line); order: 2; }
      .map-wrap { order: 1; }
      .brand-copy p { display: none; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h2>SoMa 멤버십 맵</h2>
      <p>서울·경기·인천 금액권(충전·차감) 타겟 업장 지도입니다.<br>접속 비밀번호를 입력하세요.</p>
      <div class="login-error" id="loginError"></div>
      <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn primary" id="btnLogin" type="button">입장</button>
    </div>
  </div>

  <div class="app hidden" id="app">
    <header>
      <div class="brand">
        <a class="logo" href="/">SoMa</a>
        <div class="brand-copy">
          <h1>멤버십 타겟 맵</h1>
          <p>충전 → 프로그램별 차감 → 회원 직접 예약</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="chip">전체 <strong id="stat-total">-</strong></div>
        <div class="chip">표시 <strong id="stat-shown">-</strong></div>
        <div class="chip">지도 <strong id="stat-geo">-</strong></div>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="intro">
          <div class="label">Membership ICP</div>
          <h2>미용실식 금액권으로 돌릴 수 있는 업장</h2>
          <p>다프로그램(요가·필라·PT·재활 등) · 회당가 상이 · 예약제 업장을 서울·경기·인천에서 모았습니다.</p>
        </div>

        <div class="controls">
          <input id="search" type="search" placeholder="업장·지역·태그 검색" autocomplete="off">
          <div class="row-2">
            <select id="filterMetro"><option value="">전체 권역</option></select>
            <select id="filterArea"><option value="">전체 구·시</option></select>
          </div>
          <div class="filters" id="filters">
            <button type="button" data-filter="all" class="active">전체</button>
            <button type="button" data-filter="customer">첫고객</button>
            <button type="button" data-filter="high">최우선</button>
            <button type="button" data-filter="medium">다음</button>
          </div>
        </div>

        <div class="list" id="list"></div>
      </aside>

      <div class="map-wrap">
        <div id="map"></div>
        <div class="map-legend">
          <span><i class="dot customer"></i>첫 고객</span>
          <span><i class="dot high"></i>최우선</span>
          <span><i class="dot medium"></i>다음</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AUTH_FLAG = 'soma_maps_client_auth';
    const PRIORITY_LABEL = { customer: '첫고객', high: '최우선', medium: '다음' };
    const PRIORITY_COLOR = { customer: '#22c55e', high: '#5FCDF9', medium: '#94a3b8' };

    let venues = [];
    let priorityFilter = 'all';
    let metroFilter = '';
    let areaFilter = '';
    let query = '';
    let map, cluster;
    const markerById = {};
    let activeId = null;

    async function apiFetch(url, options = {}) {
      return fetch(url, { credentials: 'same-origin', ...options });
    }

    async function isAuthed() {
      try {
        const res = await apiFetch('/api/membership-venues');
        if (res.ok) {
          sessionStorage.setItem(AUTH_FLAG, '1');
          return true;
        }
      } catch { /* ignore */ }
      sessionStorage.removeItem(AUTH_FLAG);
      return false;
    }

    async function login(password) {
      try {
        const res = await apiFetch('/api/maps-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          sessionStorage.setItem(AUTH_FLAG, '1');
          return;
        }
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || '로그인 실패');
      } catch (err) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          if (password === 'asdf1234') {
            sessionStorage.setItem(AUTH_FLAG, '1');
            return;
          }
        }
        throw err;
      }
    }

    function showApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function matches(v) {
      if (priorityFilter !== 'all' && v.priority !== priorityFilter) return false;
      if (metroFilter && (v.metro || '').indexOf(metroFilter) !== 0 && !(v.region || '').startsWith(metroFilter)) return false;
      if (areaFilter && v.area !== areaFilter) return false;
      if (!query) return true;
      const hay = [v.name, v.region, v.area, v.address, v.fit, ...(v.tags || []), ...(v.traits || [])]
        .join(' ').toLowerCase();
      return hay.includes(query);
    }

    function filtered() { return venues.filter(matches); }

    function pinIcon(priority) {
      const color = PRIORITY_COLOR[priority] || PRIORITY_COLOR.medium;
      return L.divIcon({
        className: '',
        html: `<div class="marker-pin" style="background:${color}"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -8],
      });
    }

    function fillAreaOptions() {
      const metroEl = document.getElementById('filterMetro');
      const areaEl = document.getElementById('filterArea');
      const metros = [...new Set(venues.map((v) => v.metro || (v.region || '').split(' ')[0]).filter(Boolean))].sort();
      metroEl.innerHTML = '<option value="">전체 권역</option>' + metros.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');

      const areas = [...new Set(
        venues
          .filter((v) => !metroFilter || (v.metro || '').startsWith(metroFilter) || (v.region || '').startsWith(metroFilter))
          .map((v) => v.area)
          .filter(Boolean)
      )].sort();
      areaEl.innerHTML = '<option value="">전체 구·시</option>' + areas.map((a) => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
      if (areaFilter && !areas.includes(areaFilter)) areaFilter = '';
      areaEl.value = areaFilter;
      metroEl.value = metroFilter;
    }

    function renderList() {
      const items = filtered();
      const withGeo = items.filter((v) => v.lat && v.lng);
      document.getElementById('stat-shown').textContent = items.length;
      document.getElementById('stat-geo').textContent = withGeo.length;

      // virtual-ish: only first 200 cards for scroll perf, note if truncated
      const MAX = 200;
      const slice = items.slice(0, MAX);
      const list = document.getElementById('list');
      list.innerHTML = slice.map((v) => `
        <button type="button" class="card${activeId === v.id ? ' active' : ''}" data-id="${escapeHtml(v.id)}">
          <div class="card-top">
            <h3>${escapeHtml(v.name)}</h3>
            <span class="badge ${escapeHtml(v.priority)}">${PRIORITY_LABEL[v.priority] || v.priority}</span>
          </div>
          <div class="meta">${escapeHtml(v.region || v.area || '')} · ${escapeHtml(v.address || '')}</div>
          <div class="tags">${(v.tags || []).slice(0, 5).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
          <ul class="traits">${(v.traits || []).slice(0, 3).map((t) => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
          ${v.fit ? `<div class="fit">${escapeHtml(v.fit)}</div>` : ''}
        </button>
      `).join('') + (items.length > MAX
        ? `<div class="meta" style="padding:8px 4px">리스트는 상위 ${MAX}개만 표시 · 지도에는 필터 결과 ${items.length}개 모두 표시</div>`
        : '');

      list.querySelectorAll('.card').forEach((el) => {
        el.addEventListener('click', () => selectVenue(el.dataset.id, true));
      });
    }

    function renderMarkers() {
      cluster.clearLayers();
      Object.keys(markerById).forEach((k) => delete markerById[k]);
      const items = filtered().filter((v) => v.lat && v.lng);
      items.forEach((v) => {
        const m = L.marker([v.lat, v.lng], { icon: pinIcon(v.priority) });
        const phone = v.phone ? `<div><a href="tel:${escapeHtml(v.phone)}">${escapeHtml(v.phone)}</a></div>` : '';
        m.bindPopup(`
          <strong>${escapeHtml(v.name)}</strong>
          <div>${escapeHtml(v.region || '')}</div>
          <div>${escapeHtml(v.address || '')}</div>
          ${phone}
          ${v.fit ? `<div class="popup-fit">${escapeHtml(v.fit)}</div>` : ''}
        `);
        m.on('click', () => selectVenue(v.id, false));
        cluster.addLayer(m);
        markerById[v.id] = m;
      });
    }

    function selectVenue(id, pan) {
      activeId = id;
      renderList();
      const v = venues.find((x) => x.id === id);
      const marker = markerById[id];
      if (marker) {
        cluster.zoomToShowLayer(marker, () => marker.openPopup());
        if (pan && v?.lat) map.setView([v.lat, v.lng], Math.max(map.getZoom(), 14), { animate: true });
      }
      const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
      if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function applyFilter(fitBounds) {
      fillAreaOptions();
      renderList();
      renderMarkers();
      if (!fitBounds) return;
      const items = filtered().filter((v) => v.lat && v.lng);
      if (items.length) {
        const b = L.latLngBounds(items.map((v) => [v.lat, v.lng]));
        map.fitBounds(b.pad(0.12));
      }
    }

    async function loadVenues() {
      let data;
      try {
        const res = await apiFetch('/api/membership-venues');
        if (res.ok) data = await res.json();
      } catch { /* fallback below */ }

      if (!data) {
        // local static fallback after client auth (vercel private folder)
        if (sessionStorage.getItem(AUTH_FLAG) === '1') {
          const res = await fetch('/private/membership-venues.json');
          if (!res.ok) throw new Error('venues not found');
          data = await res.json();
        } else {
          throw new Error('Unauthorized');
        }
      }

      venues = (data.venues || []).map((v, i) => ({
        ...v,
        id: v.id || `v-${i}`,
        metro: v.metro || ((v.region || '').startsWith('인천') ? '인천' : (v.region || '').startsWith('경기') ? '경기' : '서울'),
      }));
      document.getElementById('stat-total').textContent = venues.length;
    }

    async function initMapApp() {
      map = L.map('map', { zoomControl: true }).setView([37.52, 126.98], 10);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19,
      }).addTo(map);
      cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 48 });
      map.addLayer(cluster);

      await loadVenues();

      document.getElementById('filters').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-filter]');
        if (!btn) return;
        priorityFilter = btn.dataset.filter;
        document.querySelectorAll('#filters button').forEach((b) => b.classList.toggle('active', b === btn));
        applyFilter(true);
      });
      document.getElementById('filterMetro').addEventListener('change', (e) => {
        metroFilter = e.target.value;
        areaFilter = '';
        applyFilter(true);
      });
      document.getElementById('filterArea').addEventListener('change', (e) => {
        areaFilter = e.target.value;
        applyFilter(true);
      });
      document.getElementById('search').addEventListener('input', (e) => {
        query = e.target.value.trim().toLowerCase();
        applyFilter(false);
      });

      applyFilter(true);
      const customer = venues.find((v) => v.priority === 'customer');
      if (customer) setTimeout(() => selectVenue(customer.id, true), 500);
      setTimeout(() => map.invalidateSize(), 100);
    }

    async function boot() {
      const loginPassword = document.getElementById('loginPassword');
      const loginError = document.getElementById('loginError');

      const tryStart = async () => {
        showApp();
        await initMapApp();
      };

      if (await isAuthed()) {
        try { await tryStart(); return; }
        catch (err) { console.error(err); }
      }

      document.getElementById('btnLogin').addEventListener('click', async () => {
        loginError.textContent = '';
        try {
          await login(loginPassword.value);
          await tryStart();
        } catch (err) {
          if (err.message && err.message.includes('비밀')) loginError.textContent = err.message;
          else {
            console.error(err);
            loginError.textContent = err.message || '로그인 실패';
          }
        }
      });
      loginPassword.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('btnLogin').click();
      });
    }

    boot();
  </script>
</body>
</html>
