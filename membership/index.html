<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071428">
  <title>SoMa 멤버십 맵 — 충전·차감형 타겟 업장</title>
  <meta name="description" content="서울·경기·인천 금액권 멤버십 타겟 업장 지도 (비공개)">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root {
      --bg: #071428;
      --panel: rgba(12, 31, 61, 0.96);
      --panel-2: #122847;
      --line: rgba(255, 255, 255, 0.1);
      --ink: #fff;
      --ink-2: rgba(255, 255, 255, 0.72);
      --ink-3: rgba(255, 255, 255, 0.48);
      --blue: #2E8CD5;
      --cyan: #5FCDF9;
      --yellow: #FFE100;
      --customer: #22c55e;
      --high: #2E8CD5;
      --medium: #94a3b8;
      --sidebar-w: 400px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .hidden { display: none !important; }
    .login-screen {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(46,140,213,.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(95,205,249,.1), transparent 40%), var(--bg);
      padding: max(24px, var(--safe-t)) 24px max(24px, var(--safe-b));
    }
    .login-card {
      width: 100%; max-width: 360px; background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .login-card h2 { font-size: 20px; margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; line-height: 1.5; word-break: keep-all; }
    .login-card input[type="password"] {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--line);
      background: rgba(0,0,0,.25); color: var(--ink); font-size: 16px; outline: none; margin-bottom: 12px;
    }
    .login-card input[type="password"]:focus { border-color: var(--blue); }
    .login-error { color: #f87171; font-size: 12px; min-height: 18px; margin-bottom: 8px; }
    .btn.primary {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 600; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #2E8CD5, #5FCDF9); color: #071428; cursor: pointer;
    }
    .app {
      display: grid; grid-template-rows: auto 1fr;
      height: 100%; height: 100dvh;
      padding-top: var(--safe-t);
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,20,40,.96); backdrop-filter: blur(14px); z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand a.logo { color: var(--cyan); font-weight: 800; font-size: 18px; text-decoration: none; }
    .brand-copy { min-width: 0; }
    .brand-copy h1 { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-copy p { font-size: 12px; color: var(--ink-3); margin-top: 2px; word-break: keep-all; }
    .header-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .chip {
      font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(18,40,71,.8); white-space: nowrap;
    }
    .chip strong { color: var(--cyan); }
    .btn-map-toggle {
      display: none;
      appearance: none; border: 1px solid rgba(95,205,249,.45);
      background: rgba(46,140,213,.22); color: var(--cyan);
      font: inherit; font-size: 13px; font-weight: 700;
      padding: 8px 12px; border-radius: 999px; cursor: pointer; min-height: 36px;
    }
    .btn-back {
      display: none;
      appearance: none; border: 0; background: rgba(255,255,255,.08); color: #fff;
      width: 36px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer; flex-shrink: 0;
    }
    .main { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 0; }
    .sidebar {
      display: flex; flex-direction: column; min-height: 0;
      background: var(--panel); border-right: 1px solid var(--line);
    }
    .intro { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
    .intro .label {
      font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--cyan); margin-bottom: 8px;
    }
    .intro h2 { font-size: 17px; font-weight: 750; line-height: 1.35; word-break: keep-all; margin-bottom: 6px; }
    .intro p { font-size: 12px; color: var(--ink-2); line-height: 1.5; word-break: keep-all; }
    .controls { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .controls input, .controls select {
      width: 100%; border: 1px solid var(--line); background: rgba(7,20,40,.6); color: var(--ink);
      border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; outline: none;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .filters {
      display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filters button {
      appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
      font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; min-height: 36px;
    }
    .filters button.active {
      background: rgba(46,140,213,.25); border-color: rgba(95,205,249,.55); color: var(--cyan);
    }
    .list {
      flex: 1; overflow: auto; padding: 10px 12px calc(20px + var(--safe-b));
      display: flex; flex-direction: column; gap: 8px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .card {
      text-align: left; width: 100%; border: 1px solid var(--line); background: rgba(18,40,71,.55);
      border-radius: 14px; padding: 12px 13px; color: inherit; cursor: pointer; font: inherit;
      touch-action: manipulation;
    }
    .card:hover { border-color: rgba(95,205,249,.35); }
    .card.active { border-color: rgba(95,205,249,.7); background: rgba(46,140,213,.18); }
    .card-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .card h3 { font-size: 14px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
    .badge { flex-shrink: 0; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 999px; align-self: flex-start; }
    .badge.customer { background: rgba(34,197,94,.2); color: #86efac; }
    .badge.high { background: rgba(46,140,213,.22); color: #93c5fd; }
    .badge.medium { background: rgba(148,163,184,.2); color: #cbd5e1; }
    .meta { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; word-break: keep-all; }
    .score-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; align-items: center; }
    .score {
      font-size: 11px; font-weight: 800; color: var(--yellow);
      padding: 2px 7px; border-radius: 6px; background: rgba(255,225,0,.12);
    }
    .sig {
      font-size: 10px; padding: 2px 6px; border-radius: 6px;
      background: rgba(95,205,249,.12); color: var(--cyan); font-weight: 600;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.06); color: var(--ink-2); }
    .traits { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .traits li {
      font-size: 12px; color: var(--ink-2); line-height: 1.45; padding-left: 12px; position: relative; word-break: keep-all;
    }
    .traits li::before {
      content: ''; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%;
      background: var(--cyan); opacity: .7;
    }
    .fit { margin-top: 8px; font-size: 12px; color: var(--yellow); font-weight: 600; word-break: keep-all; }
    .card-cta {
      display: none;
      margin-top: 10px;
      font-size: 12px; font-weight: 700; color: var(--cyan);
    }
    .map-wrap { position: relative; min-height: 0; background: #dce6ef; }
    #map { width: 100%; height: 100%; background: #dce6ef; }
    .map-legend {
      position: absolute; left: 12px; bottom: 18px; z-index: 500; display: flex; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.92); border: 1px solid rgba(0,0,0,.08);
      font-size: 11px; color: #334155; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }
    .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
    .dot.customer { background: var(--customer); }
    .dot.high { background: var(--high); }
    .dot.medium { background: var(--medium); }
    .leaflet-popup-content-wrapper { background: #fff; color: #0f172a; border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
    .leaflet-popup-tip { background: #fff; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.45; }
    .leaflet-popup-content strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .leaflet-popup-content .popup-fit { color: #b45309; font-size: 12px; margin-top: 6px; font-weight: 600; }
    .leaflet-popup-content .popup-sig { color: #0369a1; font-size: 11px; margin-top: 4px; }
    .leaflet-popup-content a { color: #0284c7; }
    .leaflet-control-zoom a {
      background: #fff !important; color: #0f172a !important; border-color: rgba(0,0,0,.1) !important;
      width: 36px !important; height: 36px !important; line-height: 36px !important; font-size: 18px !important;
    }

    .mobile-detail { display: none; }

    @media (max-width: 900px) {
      header { padding: 8px 12px; gap: 8px; }
      .brand-copy p,
      .chip-total,
      .chip-geo,
      .intro p { display: none; }
      .brand-copy h1 { font-size: 14px; }
      .chip { font-size: 11px; padding: 5px 8px; }
      .btn-map-toggle { display: inline-flex; align-items: center; }
      .btn-back { display: none; align-items: center; justify-content: center; }
      body.mobile-map .btn-back { display: inline-flex; }
      body.mobile-map .btn-map-toggle,
      body.mobile-map .chip-shown { display: none; }

      .main {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
        min-height: 0;
      }
      .sidebar {
        grid-row: 1;
        grid-column: 1;
        z-index: 2;
        border-right: 0;
        min-height: 0;
        height: 100%;
      }
      .map-wrap {
        grid-row: 1;
        grid-column: 1;
        z-index: 1;
        visibility: hidden;
        pointer-events: none;
      }
      body.mobile-map .sidebar {
        visibility: hidden;
        pointer-events: none;
      }
      body.mobile-map .map-wrap {
        visibility: visible;
        pointer-events: auto;
      }

      .intro { padding: 12px 14px 10px; }
      .intro h2 { font-size: 15px; margin-bottom: 0; }
      .controls { padding: 10px 12px; gap: 8px; }
      .controls input, .controls select { min-height: 44px; }
      .filters button { min-height: 40px; padding: 10px 14px; }

      .list {
        padding: 10px 12px calc(28px + var(--safe-b));
        gap: 10px;
      }
      .card {
        padding: 14px;
        border-radius: 16px;
      }
      .card h3 { font-size: 15px; }
      .card .meta {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 8px;
        white-space: normal;
      }
      .card .traits {
        display: flex;
      }
      .card .traits li {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .tags { margin-bottom: 0; }
      .card .fit { display: none; }
      .card-cta { display: block; }

      .map-legend {
        left: 10px;
        right: 10px;
        bottom: calc(210px + var(--safe-b));
        justify-content: center;
        font-size: 10px;
        padding: 6px 8px;
        pointer-events: none;
      }
      .leaflet-bottom.leaflet-right {
        bottom: calc(210px + var(--safe-b)) !important;
        right: 10px !important;
      }
      .map-wrap .leaflet-popup-pane { display: none; }

      .mobile-detail {
        display: none;
        flex-direction: column;
        position: absolute;
        left: 0; right: 0; bottom: 0;
        z-index: 600;
        max-height: min(46dvh, 360px);
        background: rgba(10, 24, 48, 0.97);
        backdrop-filter: blur(14px);
        color: #fff;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -8px 32px rgba(0,0,0,.4);
        padding-bottom: var(--safe-b);
      }
      body.mobile-map .mobile-detail.open {
        display: flex;
      }
      .mobile-detail-handle {
        flex-shrink: 0;
        padding: 10px 16px 4px;
        display: flex;
        justify-content: center;
      }
      .mobile-detail-handle::before {
        content: '';
        width: 40px; height: 4px; border-radius: 999px;
        background: rgba(255,255,255,.28);
      }
      .mobile-detail-header {
        display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
        padding: 2px 14px 10px;
        border-bottom: 1px solid var(--line);
      }
      .mobile-detail-header h3 {
        font-size: 16px; font-weight: 750; line-height: 1.35; word-break: keep-all;
      }
      .mobile-detail-close {
        width: 40px; height: 40px; border: 0; border-radius: 12px;
        background: rgba(255,255,255,.08); color: #fff; font-size: 22px; line-height: 1;
        cursor: pointer; flex-shrink: 0;
      }
      .mobile-detail-body {
        overflow: auto;
        padding: 12px 14px 16px;
        -webkit-overflow-scrolling: touch;
      }
      .mobile-detail-body .meta { margin-bottom: 8px; }
      .mobile-detail-body .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .mobile-detail-body .actions a {
        display: flex; align-items: center; justify-content: center;
        min-height: 44px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700;
        text-decoration: none; border: 1px solid var(--line); color: #fff;
        background: rgba(255,255,255,.06);
      }
      .mobile-detail-body .actions a.call {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, #2E8CD5, #5FCDF9);
        color: #071428; border: 0;
      }
      .mobile-detail-body .actions a.disabled {
        opacity: .4; pointer-events: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h2>SoMa 멤버십 맵</h2>
      <p>적립(충전) 후 프로그램별 차감 시그널이 보이는 업장 위주입니다.<br>접속 비밀번호를 입력하세요.</p>
      <div class="login-error" id="loginError"></div>
      <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" enterkeyhint="go">
      <button class="btn primary" id="btnLogin" type="button">입장</button>
    </div>
  </div>

  <div class="app hidden" id="app">
    <header>
      <div class="brand">
        <button type="button" class="btn-back" id="btnBack" aria-label="목록으로">←</button>
        <a class="logo" href="/">SoMa</a>
        <div class="brand-copy">
          <h1 id="headerTitle">멤버십 타겟 맵</h1>
          <p>충전·차감 시그널 강한 순</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="chip chip-total">전체 <strong id="stat-total">-</strong></div>
        <div class="chip chip-shown">표시 <strong id="stat-shown">-</strong></div>
        <div class="chip chip-geo">지도 <strong id="stat-geo">-</strong></div>
        <button type="button" class="btn-map-toggle" id="btnMapToggle">지도 보기</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar" id="sheet">
        <div class="intro">
          <div class="label">Membership ICP</div>
          <h2>적립 후 차감이 보이는 업장 순</h2>
          <p>확정 금액권·회당가·혼합/통합권 단서가 있는 곳을 위로 모았습니다.</p>
        </div>

        <div class="controls">
          <input id="search" type="search" placeholder="업장·시그널·지역 검색" autocomplete="off" enterkeyhint="search">
          <div class="row-2">
            <select id="filterMetro"><option value="">전체 권역</option></select>
            <select id="filterArea"><option value="">전체 구·시</option></select>
          </div>
          <div class="filters" id="filters">
            <button type="button" data-filter="strong" class="active">시그널 강함</button>
            <button type="button" data-filter="customer">확정 금액권</button>
            <button type="button" data-filter="all">전체 후보</button>
          </div>
        </div>

        <div class="list" id="list"></div>
      </aside>

      <div class="map-wrap" id="mapWrap">
        <div id="map"></div>
        <div class="map-legend">
          <span><i class="dot customer"></i>확정</span>
          <span><i class="dot high"></i>강함</span>
          <span><i class="dot medium"></i>후보</span>
        </div>
        <div class="mobile-detail" id="mobileDetail" role="dialog" aria-modal="true" aria-hidden="true">
          <div class="mobile-detail-handle" id="mobileDetailHandle"></div>
          <div class="mobile-detail-header">
            <h3 id="mobileDetailTitle"></h3>
            <button type="button" class="mobile-detail-close" id="mobileDetailClose" aria-label="닫기">×</button>
          </div>
          <div class="mobile-detail-body" id="mobileDetailBody"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AUTH_FLAG = 'soma_maps_client_auth';
    const PRIORITY_LABEL = { customer: '확정', high: '강함', medium: '후보' };
    const PRIORITY_COLOR = { customer: '#22c55e', high: '#2E8CD5', medium: '#94a3b8' };
    const MQ = window.matchMedia('(max-width: 900px)');

    let venues = [];
    let priorityFilter = 'strong';
    let metroFilter = '';
    let areaFilter = '';
    let query = '';
    let map, markersLayer;
    const markerById = {};
    let activeId = null;
    let mobileView = 'list'; // list | map
    let mapReady = false;

    function isMobile() { return MQ.matches; }

    async function apiFetch(url, options = {}) {
      return fetch(url, { credentials: 'same-origin', ...options });
    }

    async function isAuthed() {
      try {
        const res = await apiFetch('/api/membership-venues');
        if (res.ok) {
          sessionStorage.setItem(AUTH_FLAG, '1');
          return true;
        }
      } catch { /* ignore */ }
      sessionStorage.removeItem(AUTH_FLAG);
      return false;
    }

    async function login(password) {
      try {
        const res = await apiFetch('/api/maps-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          sessionStorage.setItem(AUTH_FLAG, '1');
          return;
        }
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || '로그인 실패');
      } catch (err) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          if (password === 'asdf1234') {
            sessionStorage.setItem(AUTH_FLAG, '1');
            return;
          }
        }
        throw err;
      }
    }

    function showApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function matches(v) {
      if (priorityFilter === 'customer' && v.priority !== 'customer') return false;
      if (priorityFilter === 'strong' && v.priority !== 'customer' && v.priority !== 'high') return false;
      if (metroFilter && (v.metro || '').indexOf(metroFilter) !== 0 && !(v.region || '').startsWith(metroFilter)) return false;
      if (areaFilter && v.area !== areaFilter) return false;
      if (!query) return true;
      const hay = [v.name, v.region, v.area, v.address, v.fit, ...(v.tags || []), ...(v.traits || []), ...(v.creditSignals || [])]
        .join(' ').toLowerCase();
      return hay.includes(query);
    }

    function filtered() {
      return venues.filter(matches).sort((a, b) => {
        if (a.priority === 'customer' && b.priority !== 'customer') return -1;
        if (b.priority === 'customer' && a.priority !== 'customer') return 1;
        return (b.creditScore || 0) - (a.creditScore || 0);
      });
    }

    function circleStyle(priority, isActive) {
      const color = PRIORITY_COLOR[priority] || PRIORITY_COLOR.medium;
      const mobile = isMobile();
      return {
        radius: isActive ? (mobile ? 11 : 9) : (priority === 'customer' ? (mobile ? 10 : 8) : priority === 'high' ? (mobile ? 9 : 7) : (mobile ? 8 : 6)),
        color: '#fff',
        weight: isActive ? 3 : 2,
        fillColor: color,
        fillOpacity: 0.95,
      };
    }

    function setMobileView(view) {
      mobileView = view;
      document.body.classList.toggle('mobile-map', isMobile() && view === 'map');
      const title = document.getElementById('headerTitle');
      const toggle = document.getElementById('btnMapToggle');
      if (isMobile()) {
        title.textContent = view === 'map' ? '지도' : '멤버십 타겟';
        toggle.textContent = '지도 보기';
      } else {
        document.body.classList.remove('mobile-map');
        title.textContent = '멤버십 타겟 맵';
      }
      if (view === 'map') {
        ensureMap();
        setTimeout(() => {
          map.invalidateSize();
          if (activeId && markerById[activeId]) {
            const v = venues.find((x) => x.id === activeId);
            if (v?.lat) map.setView([v.lat, v.lng], Math.max(map.getZoom(), 14), { animate: false });
          } else {
            fitAll();
          }
        }, 60);
        setTimeout(() => map.invalidateSize(), 280);
      }
    }

    function showListView() {
      closeMobileDetail(false);
      activeId = null;
      setMobileView('list');
      renderList();
      if (mapReady) renderMarkers();
    }

    function openMapForVenue(id) {
      activeId = id;
      setMobileView('map');
      renderList();
      renderMarkers();
      const v = venues.find((x) => x.id === id);
      if (v) openMobileDetail(v);
      if (v?.lat) {
        setTimeout(() => {
          map.setView([v.lat, v.lng], 15, { animate: true });
        }, 80);
      }
    }

    function fillAreaOptions() {
      const metroEl = document.getElementById('filterMetro');
      const areaEl = document.getElementById('filterArea');
      const metros = [...new Set(venues.map((v) => v.metro || (v.region || '').split(' ')[0]).filter(Boolean))].sort();
      metroEl.innerHTML = '<option value="">전체 권역</option>' + metros.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
      const areas = [...new Set(
        venues
          .filter((v) => !metroFilter || (v.metro || '').startsWith(metroFilter) || (v.region || '').startsWith(metroFilter))
          .map((v) => v.area)
          .filter(Boolean)
      )].sort();
      areaEl.innerHTML = '<option value="">전체 구·시</option>' + areas.map((a) => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
      if (areaFilter && !areas.includes(areaFilter)) areaFilter = '';
      areaEl.value = areaFilter;
      metroEl.value = metroFilter;
    }

    function openMobileDetail(v) {
      if (!isMobile()) return;
      const panel = document.getElementById('mobileDetail');
      const body = document.getElementById('mobileDetailBody');
      const title = document.getElementById('mobileDetailTitle');
      title.textContent = v.name;
      const q = encodeURIComponent(v.address || v.name);
      const nameQ = encodeURIComponent(v.name);
      const phoneHref = v.phone ? `tel:${v.phone.replace(/\s+/g, '')}` : '';
      body.innerHTML = `
        <div class="meta">${escapeHtml(v.region || v.area || '')}</div>
        <div class="meta">${escapeHtml(v.address || '')}</div>
        <div class="score-row">
          <span class="score">시그널 ${v.creditScore ?? '-'}</span>
          ${(v.creditSignals || []).slice(0, 4).map((s) => `<span class="sig">${escapeHtml(s)}</span>`).join('')}
        </div>
        <div class="tags">${(v.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        <ul class="traits">${(v.traits || []).map((t) => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
        ${v.fit ? `<div class="fit">${escapeHtml(v.fit)}</div>` : ''}
        <div class="actions">
          <a class="call ${phoneHref ? '' : 'disabled'}" href="${phoneHref || '#'}">${v.phone ? `전화 ${escapeHtml(v.phone)}` : '전화 없음'}</a>
          <a href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">카카오맵</a>
          <a href="https://map.naver.com/v5/search/${nameQ}" target="_blank" rel="noopener">네이버맵</a>
        </div>
      `;
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
    }

    function closeMobileDetail(keepMap = true) {
      const panel = document.getElementById('mobileDetail');
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      if (!keepMap && isMobile()) {
        // no-op, caller handles view
      }
    }

    function renderList() {
      const items = filtered();
      const withGeo = items.filter((v) => v.lat && v.lng);
      document.getElementById('stat-shown').textContent = items.length;
      document.getElementById('stat-geo').textContent = withGeo.length;

      const MAX = 200;
      const slice = items.slice(0, MAX);
      const list = document.getElementById('list');
      list.innerHTML = slice.map((v) => `
        <button type="button" class="card${activeId === v.id ? ' active' : ''}" data-id="${escapeHtml(v.id)}">
          <div class="card-top">
            <h3>${escapeHtml(v.name)}</h3>
            <span class="badge ${escapeHtml(v.priority)}">${PRIORITY_LABEL[v.priority] || v.priority}</span>
          </div>
          <div class="meta">${escapeHtml(v.region || v.area || '')} · ${escapeHtml(v.address || '')}</div>
          <div class="score-row">
            <span class="score">시그널 ${v.creditScore ?? '-'}</span>
            ${(v.creditSignals || []).slice(0, 3).map((s) => `<span class="sig">${escapeHtml(s)}</span>`).join('')}
          </div>
          <div class="tags">${(v.tags || []).slice(0, 5).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
          <ul class="traits">${(v.traits || []).slice(0, 2).map((t) => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
          ${v.fit ? `<div class="fit">${escapeHtml(v.fit)}</div>` : ''}
          <div class="card-cta">지도에서 보기 →</div>
        </button>
      `).join('') + (items.length > MAX
        ? `<div class="meta" style="padding:8px 4px">상위 ${MAX}개 표시</div>`
        : '');

      list.querySelectorAll('.card').forEach((el) => {
        el.addEventListener('click', () => {
          if (isMobile()) openMapForVenue(el.dataset.id);
          else selectVenueDesktop(el.dataset.id, true);
        });
      });
    }

    function renderMarkers() {
      if (!mapReady) return;
      markersLayer.clearLayers();
      Object.keys(markerById).forEach((k) => delete markerById[k]);
      const items = filtered().filter((v) => v.lat && v.lng);
      items.forEach((v) => {
        const m = L.circleMarker([v.lat, v.lng], circleStyle(v.priority, activeId === v.id));
        if (!isMobile()) {
          const phone = v.phone ? `<div><a href="tel:${escapeHtml(v.phone)}">${escapeHtml(v.phone)}</a></div>` : '';
          const sigs = (v.creditSignals || []).length
            ? `<div class="popup-sig">${escapeHtml((v.creditSignals || []).slice(0, 3).join(' · '))}</div>`
            : '';
          m.bindPopup(`
            <strong>${escapeHtml(v.name)}</strong>
            <div>${escapeHtml(v.region || '')}</div>
            <div>${escapeHtml(v.address || '')}</div>
            ${phone}
            ${sigs}
            ${v.fit ? `<div class="popup-fit">${escapeHtml(v.fit)}</div>` : ''}
          `);
        }
        m.on('click', () => {
          if (isMobile()) openMapForVenue(v.id);
          else selectVenueDesktop(v.id, false);
        });
        markersLayer.addLayer(m);
        markerById[v.id] = m;
      });
    }

    function selectVenueDesktop(id, pan) {
      activeId = id;
      renderList();
      renderMarkers();
      const v = venues.find((x) => x.id === id);
      const marker = markerById[id];
      if (marker) {
        marker.openPopup();
        if (pan && v?.lat) map.setView([v.lat, v.lng], Math.max(map.getZoom(), 14), { animate: true });
      }
      const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
      if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function fitAll() {
      if (!mapReady) return;
      const items = filtered().filter((v) => v.lat && v.lng);
      if (!items.length) return;
      const b = L.latLngBounds(items.map((v) => [v.lat, v.lng]));
      map.fitBounds(b.pad(0.1));
    }

    function applyFilter(fitBounds) {
      fillAreaOptions();
      renderList();
      if (mapReady) {
        renderMarkers();
        if (fitBounds && (!isMobile() || mobileView === 'map')) fitAll();
      }
    }

    async function loadVenues() {
      let data;
      try {
        const res = await apiFetch('/api/membership-venues');
        if (res.ok) data = await res.json();
      } catch { /* fallback below */ }

      if (!data) {
        if (sessionStorage.getItem(AUTH_FLAG) === '1') {
          const res = await fetch('/private/membership-venues.json');
          if (!res.ok) throw new Error('venues not found');
          data = await res.json();
        } else {
          throw new Error('Unauthorized');
        }
      }

      venues = (data.venues || []).map((v, i) => ({
        ...v,
        id: v.id || `v-${i}`,
        creditScore: v.creditScore || 0,
        metro: v.metro || ((v.region || '').startsWith('인천') ? '인천' : (v.region || '').startsWith('경기') ? '경기' : '서울'),
      }));
      venues.sort((a, b) => (b.creditScore || 0) - (a.creditScore || 0));
      document.getElementById('stat-total').textContent = venues.length;
    }

    function ensureMap() {
      if (mapReady) return;
      map = L.map('map', {
        preferCanvas: true,
        zoomAnimation: true,
        fadeAnimation: false,
        zoomControl: false,
        tapTolerance: 22,
      }).setView([37.548, 126.98], 11);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19,
        updateWhenZooming: false,
        updateWhenIdle: true,
        keepBuffer: 2,
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      mapReady = true;
      renderMarkers();
    }

    async function initMapApp() {
      await loadVenues();

      if (!isMobile()) {
        ensureMap();
        setMobileView('list');
      } else {
        setMobileView('list');
      }

      document.getElementById('filters').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-filter]');
        if (!btn) return;
        priorityFilter = btn.dataset.filter;
        document.querySelectorAll('#filters button').forEach((b) => b.classList.toggle('active', b === btn));
        applyFilter(true);
      });
      document.getElementById('filterMetro').addEventListener('change', (e) => {
        metroFilter = e.target.value;
        areaFilter = '';
        applyFilter(true);
      });
      document.getElementById('filterArea').addEventListener('change', (e) => {
        areaFilter = e.target.value;
        applyFilter(true);
      });
      document.getElementById('search').addEventListener('input', (e) => {
        query = e.target.value.trim().toLowerCase();
        applyFilter(false);
      });

      document.getElementById('btnMapToggle').addEventListener('click', () => {
        activeId = null;
        closeMobileDetail(true);
        setMobileView('map');
        renderMarkers();
        fitAll();
      });
      document.getElementById('btnBack').addEventListener('click', showListView);
      document.getElementById('mobileDetailClose').addEventListener('click', () => {
        closeMobileDetail(true);
        activeId = null;
        renderMarkers();
      });
      document.getElementById('mobileDetailHandle').addEventListener('click', () => {
        closeMobileDetail(true);
      });

      MQ.addEventListener('change', () => {
        if (!isMobile()) {
          document.body.classList.remove('mobile-map');
          ensureMap();
          mobileView = 'list';
          closeMobileDetail(true);
          applyFilter(true);
          setTimeout(() => map.invalidateSize(), 100);
        } else {
          showListView();
        }
      });

      applyFilter(!isMobile());
      if (!isMobile()) {
        const customer = venues.find((v) => v.priority === 'customer');
        if (customer) setTimeout(() => selectVenueDesktop(customer.id, true), 400);
        setTimeout(() => map.invalidateSize(), 80);
      }
    }

    async function boot() {
      const loginPassword = document.getElementById('loginPassword');
      const loginError = document.getElementById('loginError');

      const tryStart = async () => {
        showApp();
        await initMapApp();
      };

      if (await isAuthed()) {
        try { await tryStart(); return; }
        catch (err) { console.error(err); }
      }

      document.getElementById('btnLogin').addEventListener('click', async () => {
        loginError.textContent = '';
        try {
          await login(loginPassword.value);
          await tryStart();
        } catch (err) {
          console.error(err);
          loginError.textContent = err.message || '로그인 실패';
        }
      });
      loginPassword.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('btnLogin').click();
      });
    }

    boot();
  </script>
</body>
</html>
