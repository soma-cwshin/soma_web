<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SoMa 체험 가입 현황</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(17, 28, 48, 0.92);
      --line: rgba(255, 255, 255, 0.1);
      --ink: #f4f7fb;
      --ink-2: rgba(244, 247, 251, 0.72);
      --ink-3: rgba(244, 247, 251, 0.48);
      --primary: #2E8CD5;
      --cyan: #5FCDF9;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(46, 140, 213, 0.22), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(95, 205, 249, 0.12), transparent 55%),
        var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    .login-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, var(--safe-top)) max(20px, var(--safe-right)) max(24px, var(--safe-bottom)) max(20px, var(--safe-left));
    }
    .login-screen.hidden { display: none; }
    .login-card {
      width: min(400px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
      backdrop-filter: blur(12px);
    }
    .login-card h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .login-card p {
      margin: 8px 0 18px;
      color: var(--ink-2);
      font-size: 14px;
      line-height: 1.5;
    }
    .login-card input[type="password"] {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
      color: var(--ink);
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }
    .login-card input[type="password"]:focus { border-color: var(--primary); }
    .login-error {
      min-height: 20px;
      margin: 10px 0;
      color: var(--bad);
      font-size: 13px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      touch-action: manipulation;
    }
    .btn.primary {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #1f6fad);
      color: white;
      font-size: 15px;
    }
    .btn.ghost {
      height: 40px;
      min-width: 40px;
      padding: 0 14px;
      background: rgba(255,255,255,0.06);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn.ghost:active { background: rgba(255,255,255,0.12); }

    .app { display: none; min-height: 100vh; min-height: 100dvh; padding-bottom: var(--safe-bottom); }
    .app.visible { display: block; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(12px + var(--safe-top)) max(16px, var(--safe-right)) 12px max(16px, var(--safe-left));
      background: rgba(11, 18, 32, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .brand strong {
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    .brand span {
      font-size: 12px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      padding: 16px max(16px, var(--safe-right)) 28px max(16px, var(--safe-left));
      max-width: 1280px;
      margin: 0 auto;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 12px;
    }
    .stat .label {
      font-size: 12px;
      color: var(--ink-3);
      margin-bottom: 6px;
    }
    .stat .value {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar .meta {
      font-size: 13px;
      color: var(--ink-2);
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-2);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .chip.active {
      background: rgba(46, 140, 213, 0.18);
      border-color: rgba(46, 140, 213, 0.55);
      color: var(--cyan);
    }

    .list-wrap {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(10, 16, 28, 0.7);
      overflow: hidden;
    }

    /* Desktop table */
    .desktop-only { display: block; }
    .mobile-only { display: none; }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 13px;
    }
    th {
      position: sticky;
      top: 0;
      background: #121c31;
      color: var(--ink-3);
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      z-index: 1;
    }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody tr:last-child td { border-bottom: none; }

    .center-name {
      font-weight: 650;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .sub {
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.4;
    }
    .num {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      font-size: 15px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .badge.trial { background: rgba(52, 211, 153, 0.15); color: var(--good); }
    .badge.expired { background: rgba(248, 113, 113, 0.15); color: var(--bad); }
    .badge.paid { background: rgba(46, 140, 213, 0.18); color: var(--cyan); }
    .badge.muted { background: rgba(148, 163, 184, 0.15); color: var(--muted); }

    .trial-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-top: 8px;
      width: 140px;
      max-width: 100%;
    }
    .trial-bar.full { width: 100%; }
    .trial-bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--good), var(--warn), var(--bad));
    }

    /* Mobile cards */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }
    .center-card {
      background: rgba(17, 28, 48, 0.95);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card-top .left { min-width: 0; flex: 1; }
    .card-user {
      margin-top: 6px;
      font-size: 14px;
      color: var(--ink-2);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .metric {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }
    .metric .k {
      font-size: 11px;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .metric .v {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .trial-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .trial-grid .label {
      font-size: 11px;
      color: var(--ink-3);
      margin-bottom: 4px;
    }

    .empty, .error, .loading {
      padding: 40px 20px;
      text-align: center;
      color: var(--ink-2);
      font-size: 14px;
    }
    .error { color: var(--bad); }

    @media (max-width: 900px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: block; }

      .summary {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }
      .stat:nth-child(1),
      .stat:nth-child(2) { grid-column: span 3; }
      .stat:nth-child(3),
      .stat:nth-child(4),
      .stat:nth-child(5) { grid-column: span 2; }
      .stat {
        padding: 12px 10px 10px;
        border-radius: 12px;
      }
      .stat .label { font-size: 11px; margin-bottom: 4px; }
      .stat .value { font-size: 20px; }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .filters {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 8px;
        margin: 0 -16px;
        padding: 0 16px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .filters::-webkit-scrollbar { display: none; }
      .chip {
        height: 40px;
        flex: 0 0 auto;
        font-size: 14px;
      }

      .list-wrap {
        border: none;
        background: transparent;
        border-radius: 0;
        overflow: visible;
      }
      .card-list { padding: 0; }
    }

    @media (max-width: 380px) {
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .metric { padding: 8px 4px; }
      .metric .v { font-size: 16px; }
      .trial-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>SoMa 체험 현황</h1>
      <p>명함 배포 후 가입·체험·앱 사용을 데일리로 확인합니다.</p>
      <div class="login-error" id="loginError"></div>
      <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" inputmode="text">
      <div style="height:12px"></div>
      <button class="btn primary" id="loginBtn" type="button">입장</button>
    </div>
  </div>

  <div class="app" id="app">
    <header>
      <div class="brand">
        <strong>체험 가입 현황</strong>
        <span id="sinceLabel">2026-08-10 이후 신규 센터</span>
      </div>
      <div class="header-actions">
        <button class="btn ghost" id="refreshBtn" type="button" aria-label="새로고침">새로고침</button>
      </div>
    </header>

    <main>
      <section class="summary" id="summary">
        <div class="stat"><div class="label">신규 센터</div><div class="value" id="sCenters">–</div></div>
        <div class="stat"><div class="label">체험 진행중</div><div class="value" id="sTrials">–</div></div>
        <div class="stat"><div class="label">회원등록</div><div class="value" id="sMembers">–</div></div>
        <div class="stat"><div class="label">예약</div><div class="value" id="sBookings">–</div></div>
        <div class="stat"><div class="label">AI 리포트</div><div class="value" id="sReports">–</div></div>
      </section>

      <div class="toolbar">
        <div class="meta" id="updatedAt">불러오는 중…</div>
        <div class="filters">
          <button class="chip active" data-filter="all" type="button">전체</button>
          <button class="chip" data-filter="trial" type="button">체험만</button>
          <button class="chip" data-filter="active" type="button">사용중</button>
        </div>
      </div>

      <div class="list-wrap">
        <div class="loading" id="loading">데이터 불러오는 중…</div>
        <div class="error" id="error" hidden></div>

        <div class="desktop-only">
          <table id="table" hidden>
            <thead>
              <tr>
                <th>센터 / 가입</th>
                <th>유저</th>
                <th>체험 경과</th>
                <th>남은 기간</th>
                <th>회원등록</th>
                <th>예약</th>
                <th>AI 리포트</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div class="mobile-only">
          <div class="card-list" id="cardList" hidden></div>
        </div>

        <div class="empty" id="empty" hidden>해당 조건의 센터가 없습니다.</div>
      </div>
    </main>
  </div>

  <script>
    const DEFAULT_SINCE = '2026-08-10T00:00:00+09:00';
    let rows = [];
    let filter = 'all';

    async function apiFetch(url, options = {}) {
      const res = await fetch(url, {
        credentials: 'same-origin',
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      let data = null;
      try { data = await res.json(); } catch { data = null; }
      if (!res.ok) {
        const err = new Error((data && (data.error || data.message)) || '요청 실패');
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function fmtDate(iso) {
      if (!iso) return '–';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '–';
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(d);
    }

    function fmtDuration(seconds) {
      if (seconds == null || Number.isNaN(Number(seconds))) return '–';
      const s = Math.trunc(Number(seconds));
      const abs = Math.abs(s);
      const days = Math.floor(abs / 86400);
      const hours = Math.floor((abs % 86400) / 3600);
      const mins = Math.floor((abs % 3600) / 60);
      let body = '';
      if (days > 0) body = `${days}일 ${hours}시간`;
      else if (hours > 0) body = `${hours}시간 ${mins}분`;
      else body = `${mins}분`;
      return s < 0 ? `${body} 지남` : body;
    }

    function trialBadge(row) {
      if (row.is_trial && row.sub_status === 'active' && Number(row.remaining_seconds) > 0) {
        return '<span class="badge trial">체험중</span>';
      }
      if (row.is_trial && Number(row.remaining_seconds) <= 0) {
        return '<span class="badge expired">체험만료</span>';
      }
      if (row.sub_status === 'active') {
        return '<span class="badge paid">유료</span>';
      }
      if (row.sub_status) {
        return `<span class="badge muted">${escapeHtml(row.sub_status)}</span>`;
      }
      return '<span class="badge muted">구독없음</span>';
    }

    function progressPct(row) {
      const start = row.trial_start ? new Date(row.trial_start).getTime() : NaN;
      const end = row.trial_end ? new Date(row.trial_end).getTime() : NaN;
      if (Number.isNaN(start) || Number.isNaN(end) || end <= start) return 0;
      const now = Date.now();
      return Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100));
    }

    function trainerNames(row) {
      const list = Array.isArray(row.trainers) ? row.trainers : [];
      if (!list.length) return escapeHtml(row.user_name || '–');
      if (list.length === 1) return escapeHtml(list[0].userName);
      return `${escapeHtml(list[0].userName)} <span class="sub">외 ${list.length - 1}명</span>`;
    }

    function matchesFilter(row) {
      if (filter === 'all') return true;
      if (filter === 'trial') return !!row.is_trial;
      if (filter === 'active') {
        return (row.member_registrations || 0) + (row.booking_count || 0) + (row.ai_report_count || 0) > 0;
      }
      return true;
    }

    function renderSummary(summary) {
      const s = summary || {};
      document.getElementById('sCenters').textContent = s.centerCount ?? 0;
      document.getElementById('sTrials').textContent = s.activeTrialCount ?? 0;
      document.getElementById('sMembers').textContent = s.memberRegistrations ?? 0;
      document.getElementById('sBookings').textContent = s.bookingCount ?? 0;
      document.getElementById('sReports').textContent = s.aiReportCount ?? 0;
    }

    function renderList() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const table = document.getElementById('table');
      const cardList = document.getElementById('cardList');
      const empty = document.getElementById('empty');
      const tbody = document.getElementById('tbody');
      loading.hidden = true;
      error.hidden = true;

      const filtered = rows.filter(matchesFilter);
      if (!filtered.length) {
        table.hidden = true;
        cardList.hidden = true;
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      table.hidden = false;
      cardList.hidden = false;

      tbody.innerHTML = filtered.map((row) => {
        const pct = progressPct(row);
        const trainersHint = Array.isArray(row.trainers) && row.trainers.length > 1
          ? row.trainers.map(t => t.userName).join(', ')
          : '';
        return `
          <tr>
            <td>
              <div class="center-name">${escapeHtml(row.center_name || '–')}</div>
              <div class="sub">가입 ${fmtDate(row.center_created_at)}</div>
              <div style="margin-top:6px">${trialBadge(row)}</div>
            </td>
            <td>
              <div>${trainerNames(row)}</div>
              ${trainersHint ? `<div class="sub">${escapeHtml(trainersHint)}</div>` : ''}
            </td>
            <td>
              <div class="num">${fmtDuration(row.elapsed_seconds)}</div>
              <div class="sub">${fmtDate(row.trial_start)} ~</div>
              <div class="trial-bar"><i style="width:${pct.toFixed(1)}%"></i></div>
            </td>
            <td>
              <div class="num">${fmtDuration(row.remaining_seconds)}</div>
              <div class="sub">~ ${fmtDate(row.trial_end)}</div>
            </td>
            <td class="num">${row.member_registrations ?? 0}</td>
            <td class="num">${row.booking_count ?? 0}</td>
            <td class="num">${row.ai_report_count ?? 0}</td>
          </tr>
        `;
      }).join('');

      cardList.innerHTML = filtered.map((row) => {
        const pct = progressPct(row);
        const trainersHint = Array.isArray(row.trainers) && row.trainers.length > 1
          ? row.trainers.map(t => t.userName).join(', ')
          : '';
        return `
          <article class="center-card">
            <div class="card-top">
              <div class="left">
                <div class="center-name">${escapeHtml(row.center_name || '–')}</div>
                <div class="sub">가입 ${fmtDate(row.center_created_at)}</div>
                <div class="card-user">${trainerNames(row)}</div>
                ${trainersHint ? `<div class="sub">${escapeHtml(trainersHint)}</div>` : ''}
              </div>
              ${trialBadge(row)}
            </div>

            <div class="trial-grid">
              <div>
                <div class="label">체험 경과</div>
                <div class="num">${fmtDuration(row.elapsed_seconds)}</div>
                <div class="sub">${fmtDate(row.trial_start)}</div>
              </div>
              <div>
                <div class="label">남은 기간</div>
                <div class="num">${fmtDuration(row.remaining_seconds)}</div>
                <div class="sub">${fmtDate(row.trial_end)}</div>
              </div>
            </div>
            <div class="trial-bar full"><i style="width:${pct.toFixed(1)}%"></i></div>

            <div class="metrics">
              <div class="metric"><div class="k">회원등록</div><div class="v">${row.member_registrations ?? 0}</div></div>
              <div class="metric"><div class="k">예약</div><div class="v">${row.booking_count ?? 0}</div></div>
              <div class="metric"><div class="k">AI 리포트</div><div class="v">${row.ai_report_count ?? 0}</div></div>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadData() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const table = document.getElementById('table');
      const cardList = document.getElementById('cardList');
      const empty = document.getElementById('empty');
      loading.hidden = false;
      error.hidden = true;
      table.hidden = true;
      cardList.hidden = true;
      empty.hidden = true;

      try {
        const data = await apiFetch(`/api/subs-data?since=${encodeURIComponent(DEFAULT_SINCE)}`);
        rows = Array.isArray(data.rows) ? data.rows : [];
        renderSummary(data.summary);
        document.getElementById('updatedAt').textContent =
          `기준 ${fmtDate(data.generatedAt)} · ${rows.length}개 센터`;
        renderList();
        return true;
      } catch (err) {
        if (err.status === 401) throw err;
        loading.hidden = true;
        error.hidden = false;
        error.textContent = err.message || '불러오기 실패';
        return false;
      }
    }

    async function login(password) {
      await apiFetch('/api/subs-auth', {
        method: 'POST',
        body: JSON.stringify({ password }),
      });
      showApp();
      await loadData();
    }

    function showLogin() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('app').classList.remove('visible');
    }

    function showApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const loginError = document.getElementById('loginError');
      const loginPassword = document.getElementById('loginPassword');
      loginError.textContent = '';
      try {
        await login(loginPassword.value);
      } catch (err) {
        loginError.textContent = err.message || '로그인 실패';
      }
    });

    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => loadData());

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        filter = chip.dataset.filter;
        renderList();
      });
    });

    (async () => {
      try {
        await loadData();
        showApp();
      } catch (err) {
        if (err.status === 401) showLogin();
        else showApp();
      }
    })();
  </script>
</body>
</html>
